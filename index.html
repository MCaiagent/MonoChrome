<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MonoChrome — Voice Assistant</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --line: #1e252c;
    --cyan: #4dd8e6;
    --cyan-dim: #2a6b73;
    --text: #d8e2e6;
    --text-dim: #6b7b82;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 16px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--cyan);
    text-transform: uppercase;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  h1 span { color: var(--cyan); }

  /* Signature element: pulsing voice orb */
  .orb-wrap {
    width: 160px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 28px 0 20px;
    position: relative;
  }

  .orb {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fe9f2, var(--cyan-dim) 70%);
    box-shadow: 0 0 30px rgba(77, 216, 230, 0.35);
    transition: all 0.25s ease;
    position: relative;
    z-index: 2;
  }

  .ring {
    position: absolute;
    border: 1px solid var(--cyan-dim);
    border-radius: 50%;
    opacity: 0;
  }

  .listening .orb {
    animation: pulse 1.1s infinite ease-in-out;
    box-shadow: 0 0 45px rgba(77, 216, 230, 0.6);
  }

  .listening .ring {
    animation: ripple 1.6s infinite ease-out;
  }

  .ring:nth-child(2) { animation-delay: 0.4s; }
  .ring:nth-child(3) { animation-delay: 0.8s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  @keyframes ripple {
    0% { width: 90px; height: 90px; opacity: 0.6; }
    100% { width: 170px; height: 170px; opacity: 0; }
  }

  .status {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-align: center;
    min-height: 16px;
    margin-bottom: 20px;
  }

  .status.active { color: var(--cyan); }

  #mic-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cyan);
    font-size: 26px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #mic-btn:hover { border-color: var(--cyan-dim); }
  #mic-btn.on { background: var(--cyan); color: var(--bg); }

  .log {
    width: 100%;
    max-width: 480px;
    flex: 1;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 85%;
    border: 1px solid var(--line);
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--panel);
    border-color: var(--cyan-dim);
  }

  .bubble.MonoChrome {
    align-self: flex-start;
    background: transparent;
    color: var(--text);
  }

  .bubble .who {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--cyan);
    display: block;
    margin-bottom: 4px;
  }

  footer {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    padding-top: 8px;
  }

  input#server-url {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">PERSONAL VOICE AGENT</div>
    <h1>MONO<span>C</span>HROME</h1>
  </header>

  <input id="server-url" type="text" value="https://monochrome-uh8z.onrender.com" />

  <div class="orb-wrap" id="orb-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orb"></div>
  </div>

  <div class="status" id="status">Mic-e tap korun ebong bolun</div>

  <button id="mic-btn">🎤</button>

  <div class="log" id="log"></div>

  <footer>MonoChrome — LOCAL PROTOTYPE — v0.1</footer>

<script>
  const micBtn = document.getElementById('mic-btn');
  const orbWrap = document.getElementById('orb-wrap');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const serverInput = document.getElementById('server-url');

  let recognition = null;
  let listening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusEl.textContent = "⚠️ Ei browser voice input support kore na. Chrome use korun.";
    micBtn.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'bn-BD'; // Bangla; English bollew-o mostly bujhbe
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      orbWrap.classList.add('listening');
      micBtn.classList.add('on');
      statusEl.textContent = "শুনছি...";
      statusEl.classList.add('active');
    };

    recognition.onend = () => {
      listening = false;
      orbWrap.classList.remove('listening');
      micBtn.classList.remove('on');
      statusEl.classList.remove('active');
    };

    recognition.onerror = (e) => {
      statusEl.textContent = "Error: " + e.error;
    };

    recognition.onresult = async (event) => {
      const transcript = event.results[0][0].transcript;
      addBubble('user', transcript);
      statusEl.textContent = "চিন্তা করছি...";
      await sendToBackend(transcript);
    };
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });

  function addBubble(who, text) {
    const div = document.createElement('div');
    div.className = 'bubble ' + who;
    div.innerHTML = `<span class="who">${who === 'user' ? 'YOU' : 'MonoChrome'}</span>${text}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function sendToBackend(message) {
    const serverUrl = serverInput.value.trim().replace(/\/$/, '');
    try {
      const res = await fetch(serverUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      if (data.reply) {
        addBubble('MonoChrome', data.reply);
        speak(data.reply);
        statusEl.textContent = "Mic-e tap korun ebong bolun";
      } else {
        statusEl.textContent = "Server theke reply pawa jay nai";
      }
    } catch (err) {
      statusEl.textContent = "⚠️ Server-e connect kora jacche na. URL check korun.";
      console.error(err);
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'bn-BD';
    utter.rate = 1.0;
    window.speechSynthesis.speak(utter);
  }
</script>

</body>
</html>
